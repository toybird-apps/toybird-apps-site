name: One-time SEO foundation sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-seo-foundation.yml

permissions:
  contents: write

jobs:
  update-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply SEO foundation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from xml.sax.saxutils import escape

          base = 'https://labs.toybird.com/'
          apps = [
              'ai-lifematch','ai-memorize-sheet','art-spot','brainlot-puzzle',
              'dropready-media','fifteenminwalk','find-it-show-it','gmail-spotlight-indexer',
              'koesub','meet-here-card','meeting-ready','pocket-screen','pointer-cue',
              'prompt-ready','qbr-survival','screenshot-ledger','voicepocket','yuru-dansha'
          ]
          bilingual = {
              'ai-lifematch','ai-memorize-sheet','art-spot','dropready-media','find-it-show-it',
              'meet-here-card','meeting-ready','prompt-ready','voicepocket','yuru-dansha'
          }

          def replace_or_insert_meta(text, name, content):
              pat = re.compile(r'<meta\b[^>]*\bname=["\']' + re.escape(name) + r'["\'][^>]*>', re.I)
              tag = f'<meta name="{name}" content="{content}">'
              if pat.search(text):
                  return pat.sub(tag, text, count=1)
              return text.replace('</head>', f'  {tag}\n</head>', 1)

          def replace_or_insert_canonical(text, url):
              pat = re.compile(r'<link\b[^>]*\brel=["\']canonical["\'][^>]*>', re.I)
              tag = f'<link rel="canonical" href="{url}">'
              if pat.search(text):
                  return pat.sub(tag, text, count=1)
              return text.replace('</head>', f'  {tag}\n</head>', 1)

          def set_hreflang(text, en_url, ja_url):
              # Remove existing hreflang alternate links only.
              text = re.sub(r'\s*<link\b(?=[^>]*\brel=["\']alternate["\'])(?=[^>]*\bhreflang=["\'][^"\']+["\'])[^>]*>', '', text, flags=re.I)
              block = (
                  f'  <link rel="alternate" hreflang="en" href="{en_url}">\n'
                  f'  <link rel="alternate" hreflang="ja" href="{ja_url}">\n'
                  f'  <link rel="alternate" hreflang="x-default" href="{en_url}">\n'
              )
              return text.replace('</head>', block + '</head>', 1)

          changed = []
          seo_urls = []

          # Root
          root = Path('index.html')
          text = root.read_text(encoding='utf-8')
          new = replace_or_insert_meta(text, 'robots', 'index,follow,max-image-preview:large')
          new = replace_or_insert_canonical(new, base)
          if new != text:
              root.write_text(new, encoding='utf-8')
              changed.append(str(root))
          seo_urls.append(base)

          # Product landing pages
          for app in apps:
              en_path = Path('apps') / app / 'index.html'
              if not en_path.exists():
                  raise SystemExit(f'Missing English product page: {en_path}')
              en_url = f'{base}apps/{app}/'
              text = en_path.read_text(encoding='utf-8')
              new = replace_or_insert_meta(text, 'robots', 'index,follow,max-image-preview:large')
              new = replace_or_insert_canonical(new, en_url)
              if app in bilingual:
                  ja_url = f'{base}apps/{app}/ja/'
                  new = set_hreflang(new, en_url, ja_url)
              if new != text:
                  en_path.write_text(new, encoding='utf-8')
                  changed.append(str(en_path))
              seo_urls.append(en_url)

              if app in bilingual:
                  ja_path = Path('apps') / app / 'ja' / 'index.html'
                  if not ja_path.exists():
                      raise SystemExit(f'Missing Japanese product page: {ja_path}')
                  ja_url = f'{base}apps/{app}/ja/'
                  text = ja_path.read_text(encoding='utf-8')
                  new = replace_or_insert_meta(text, 'robots', 'index,follow,max-image-preview:large')
                  new = replace_or_insert_canonical(new, ja_url)
                  new = set_hreflang(new, en_url, ja_url)
                  if new != text:
                      ja_path.write_text(new, encoding='utf-8')
                      changed.append(str(ja_path))
                  seo_urls.append(ja_url)

          if len(seo_urls) != 29:
              raise SystemExit(f'Expected 29 sitemap URLs, got {len(seo_urls)}')

          # Privacy / Support utility pages should not compete with product pages in search.
          utility_count = 0
          for path in sorted(Path('apps').glob('**/*.html')):
              if path.name not in {'privacy.html','support.html'}:
                  continue
              text = path.read_text(encoding='utf-8')
              new = replace_or_insert_meta(text, 'robots', 'noindex,follow')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
              utility_count += 1

          if utility_count != 56:
              raise SystemExit(f'Expected 56 privacy/support pages, got {utility_count}')

          Path('robots.txt').write_text(
              'User-agent: *\nAllow: /\n\nSitemap: https://labs.toybird.com/sitemap.xml\n',
              encoding='utf-8'
          )
          changed.append('robots.txt')

          lastmod = '2026-09-07'
          sitemap = ['<?xml version="1.0" encoding="UTF-8"?>',
                     '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for url in seo_urls:
              sitemap += ['  <url>', f'    <loc>{escape(url)}</loc>', f'    <lastmod>{lastmod}</lastmod>', '  </url>']
          sitemap.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(sitemap) + '\n', encoding='utf-8')
          changed.append('sitemap.xml')

          print(f'SEO_SYNC_SUMMARY indexable={len(seo_urls)} utility_noindex={utility_count} changed={len(set(changed))}')
          print('SITEMAP_URLS')
          for u in seo_urls:
              print(u)
          PY

      - name: Commit SEO foundation
        shell: bash
        run: |
          if git diff --quiet && [ -f robots.txt ] && [ -f sitemap.xml ]; then
            echo 'No HTML changes; checking new SEO files'
          fi
          git config user.name 'Toybird Labs'
          git config user.email 'tb.masaki@gmail.com'
          git add index.html apps robots.txt sitemap.xml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Add SEO foundation for labs.toybird.com'
          git push
