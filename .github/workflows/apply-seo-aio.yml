name: Apply SEO and AIO metadata

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_seo_aio.py
      - .github/workflows/apply-seo-aio.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Snapshot visible page bodies
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          tree = ET.parse("sitemap.xml")
          snapshots = {}
          for node in tree.findall(".//sm:loc", ns):
              url = (node.text or "").strip()
              if not url.startswith("https://labs.toybird.com/"):
                  continue
              rel = urlparse(url).path.lstrip("/")
              path = Path(rel) / "index.html" if rel else Path("index.html")
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              match = re.search(r"<body\b[^>]*>.*?</body>", text, re.I | re.S)
              if not match:
                  raise SystemExit(f"Missing body in {path}")
              snapshots[path.as_posix()] = hashlib.sha256(match.group(0).encode()).hexdigest()
          Path("/tmp/seo-body-hashes.json").write_text(json.dumps(snapshots), encoding="utf-8")
          print(f"Snapshotted {len(snapshots)} visible page bodies.")
          PY

      - name: Apply metadata normalization
        run: python3 scripts/apply_seo_aio.py

      - name: Verify no visible content changed
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          before = json.loads(Path("/tmp/seo-body-hashes.json").read_text(encoding="utf-8"))
          for path_text, expected in before.items():
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              match = re.search(r"<body\b[^>]*>.*?</body>", text, re.I | re.S)
              if not match:
                  raise SystemExit(f"Missing body after update: {path}")
              actual = hashlib.sha256(match.group(0).encode()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"Visible body changed unexpectedly: {path}")
          print("Verified: all visible <body> content is byte-for-byte unchanged.")
          PY

      - name: Validate SEO and AIO metadata
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          tree = ET.parse("sitemap.xml")
          pages = []
          for node in tree.findall(".//sm:loc", ns):
              url = (node.text or "").strip()
              if not url.startswith("https://labs.toybird.com/"):
                  continue
              rel = urlparse(url).path.lstrip("/")
              path = Path(rel) / "index.html" if rel else Path("index.html")
              if path.exists():
                  pages.append((path, url))

          if not pages:
              raise SystemExit("No public landing pages found in sitemap.")

          for path, url in pages:
              text = path.read_text(encoding="utf-8")
              required = [
                  'name="description"',
                  'rel="canonical"',
                  'property="og:title"',
                  'property="og:description"',
                  'property="og:url"',
                  'property="og:site_name"',
                  'application/ld+json',
              ]
              missing = [item for item in required if item not in text]
              if missing:
                  raise SystemExit(f"Missing metadata in {path}: {missing}")
              if url not in text:
                  raise SystemExit(f"Canonical page URL not present in {path}: {url}")
              if path == Path("index.html"):
                  if '"@type": "WebSite"' not in text or '"@type": "Organization"' not in text:
                      raise SystemExit("Homepage WebSite/Organization structured data missing.")
              elif '"@type": "SoftwareApplication"' not in text:
                  raise SystemExit(f"SoftwareApplication structured data missing: {path}")

          print(f"Validated {len(pages)} public landing pages.")
          PY

      - name: Verify changed-file scope
        run: |
          python3 - <<'PY'
          import subprocess

          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          bad = []
          for path in changed:
              if path == "sitemap.xml" or path == "index.html":
                  continue
              if path.startswith("apps/") and path.endswith("/index.html"):
                  continue
              bad.append(path)
          if bad:
              raise SystemExit(f"Unexpected files changed: {bad}")
          print(f"Safe change scope: {len(changed)} files.")
          PY

      - name: Commit production metadata changes
        run: |
          if git diff --quiet; then
            echo "No SEO/AIO metadata changes were needed."
            exit 0
          fi
          git config user.name "Toybird Labs Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html apps/*/index.html apps/*/ja/index.html sitemap.xml
          git commit -m "Apply SEO/AIO metadata across public landing pages"
          git push origin HEAD:main
