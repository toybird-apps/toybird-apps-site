name: One-time LP hub link update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/link-lp-hub-20260906.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Products & Guides links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          nav_old = '      <a href="#apps">Apps</a>\n'
          nav_new = '      <a href="#apps">Apps</a>\n      <a href="https://lp.toybird.com/">Products &amp; Guides</a>\n'
          if 'https://lp.toybird.com/">Products &amp; Guides</a>' not in s:
              s = s.replace(nav_old, nav_new, 1)

          hero_old = '          <a class="button button-primary" href="apps/pocket-screen/">Explore Pocket Screen</a>\n'
          hero_new = hero_old + '          <a class="button button-secondary" href="https://lp.toybird.com/">Products &amp; Guides</a>\n'
          if s.count('https://lp.toybird.com/">Products &amp; Guides</a>') < 2:
              s = s.replace(hero_old, hero_new, 1)

          footer_old = '    <span class="footer-links">\n'
          footer_new = footer_old + '      <a href="https://lp.toybird.com/">Products &amp; Guides</a>\n'
          if s.count('https://lp.toybird.com/">Products &amp; Guides</a>') < 3:
              s = s.replace(footer_old, footer_new, 1)

          if s.count('https://lp.toybird.com/">Products &amp; Guides</a>') != 3:
              raise SystemExit('Expected three LP hub links after update')
          p.write_text(s, encoding='utf-8')
          PY

          rm .github/workflows/link-lp-hub-20260906.yml

      - name: Commit applied change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Toybird Labs"
          git config user.email "tb.masaki@gmail.com"
          git add -A
          git commit -m "Link Toybird Labs to Products & Guides hub"
          git push origin HEAD:main
